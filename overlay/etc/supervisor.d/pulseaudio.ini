
[program:pulseaudio]
priority=30
autostart=true
autorestart=true
directory=/
user=%(ENV_USER)s
command=/usr/bin/start-pulseaudio.sh
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
stopsignal=INT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

