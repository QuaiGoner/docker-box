[program:selkies]
command=/bin/bash -c 'export DISPLAY="${DISPLAY:-:55}"; export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp}"; export PIPEWIRE_RUNTIME_DIR="${PIPEWIRE_RUNTIME_DIR:-${XDG_RUNTIME_DIR:-/tmp}}"; export PULSE_RUNTIME_PATH="${PULSE_RUNTIME_PATH:-${XDG_RUNTIME_DIR:-/tmp}/pulse}"; export PIPEWIRE_LATENCY="128/48000"; export PULSE_SERVER="${PULSE_SERVER:-unix:${PULSE_RUNTIME_PATH:-${XDG_RUNTIME_DIR:-/tmp}/pulse}/pulse-socket}"; exec /opt/selkies-gstreamer/selkies-gstreamer/selkies-gstreamer-run --addr=0.0.0.0 --port="$SELKIES_PORT" --enable_https=false --https_cert=/etc/ssl/certs/ssl-cert-snakeoil.pem --https_key=/etc/ssl/private/ssl-cert-snakeoil.key --basic_auth_user="$SUNSHINE_USER" --basic_auth_password="$SUNSHINE_PASS" --encoder=x264enc --enable_resize=false'

autostart=true
autorestart=true

startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true

environment=DISPLAY="%(ENV_DISPLAY)s",PULSE_SERVER="%(ENV_PULSE_SERVER)s",PIPEWIRE_LATENCY="128/48000",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",PIPEWIRE_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",PULSE_RUNTIME_PATH="%(ENV_XDG_RUNTIME_DIR)s/pulse",SELKIES_PORT="%(ENV_SELKIES_PORT)s",SELKIES_ENCODER="%(ENV_SELKIES_ENCODER)s",SELKIES_USER="%(ENV_SUNSHINE_USER)s",SELKIES_PASS="%(ENV_SUNSHINE_USER)s"
stdout_logfile=/var/log/supervisor/selkies.log
stderr_logfile=/var/log/supervisor/selkies.err.log